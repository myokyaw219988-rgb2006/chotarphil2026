<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ချိုတာဖီးလ်</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 40px 15px;
    }

    .logo {
      width: 200px;
      height: 200px;
      border: 5px solid gold;
      border-radius: 50%;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: gold;
      box-shadow: 0 0 20px gold;
    }

    .mm {
      font-size: 28px;
      font-weight: bold;
    }

    .en {
      font-size: 14px;
      letter-spacing: 4px;
      margin-top: 10px;
    }

    h1 {
      margin-top: 35px;
      font-size: 25px;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
    }

    button {
      display: block;
      width: 85%;
      max-width: 350px;
      margin: 18px auto;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: gold;
      color: black;
      font-weight: bold;
    }

    .social {
      background: white;
    }

    #message {
      color: gold;
      font-weight: bold;
    }

    .footer {
      margin-top: 50px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="logo">
    <div class="mm">ချိုတာဖီးလ်</div>
    <div class="en">CHO TAR PHIL</div>
  </div>

  <h1>ချိုတာဖီးလ် Website မှ ကြိုဆိုပါတယ် 👋</h1>

  <p>
    Website အသစ်လေးမို့<br>
    အားပေးကြပါအုံးနော် ❤️
  </p>

  <button onclick="showMessage()">
    နှိပ်ကြည့် 👆
  </button>

  <p id="message"></p>

  <h2>ဆက်သွယ်ရန်</h2>

  <button class="social"
    onclick="window.open('https://www.tiktok.com/@myokyaw0633','_blank')">
    🎵 TikTok
  </button>

  <button class="social"
    onclick="window.open('https://t.me/chome232','_blank')">
    ✈️ Telegram
  </button>

  <div class="footer">
    © 2026 CHO TAR PHIL
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").innerHTML =
        "ချိုတာဖီးလ်ကို လာရောက်အားပေးတဲ့အတွက် ကျေးဇူးတင်ပါတယ် ❤️";
    }
  </script>

</body>
</html>
